name: daily-tw-stock
on:
  schedule:
    - cron: '36 8 * * 1-5'
    - cron: '36 13 * * 1-5'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (鎖 numpy 1.x 避開 _ARRAY_API)
        run: |
          pip install --upgrade pip
          pip install "numpy==1.26.4" "pandas==2.2.2" "pyarrow==15.0.2" requests
          python -c "import pyarrow; print(pyarrow.__version__)"

      - name: Run fetch
        run: python scripts/fetch.py

      - name: Commit parquet
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add data/tw_close_110d.parquet
          git diff --staged --quiet || git commit -m "update $(date +%Y-%m-%d)"
          git push
