name: daily-tw-stock
on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow requests
      - run: python scripts/fetch.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add data/tw_close_110d.parquet
          git diff --staged --quiet || git commit -m "update $(date +%Y-%m-%d)"
          git push
