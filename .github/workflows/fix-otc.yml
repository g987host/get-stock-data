name: fix-otc-once
on:
  workflow_dispatch:  # 讓你可以手動按按鈕跑

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow requests
      - run: python scripts/fix_otc.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add data/tw_close_110d.parquet
          git diff --staged --quiet || git commit -m "merge OTC into 110d"
          git push
