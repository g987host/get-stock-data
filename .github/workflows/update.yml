name: update-data

on:
  schedule:
    - cron: '0 20 * * 5'   # 每週五 20:00 台北時間 = 12:00 UTC，跑 tdcc
    - cron: '0 20 10 * *'  # 每月10號 22:00 台北時間，跑 revenue
  workflow_dispatch:       # 這個一定要有，才會有 Run workflow 按鈕

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pandas pyarrow

      - name: Run TDCC + Revenue
        run: |
          python tdcc.py
          python revenue.py

      - name: Commit data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto update data"
          file_pattern: "data/*.parquet data/*.csv data/*.json"
